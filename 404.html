<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Pink Beluga</title>
  <meta name="robots" content="noindex" />
  <!--
    This page can be served from any URL on the site, so relative paths may not
    resolve. Styles are inline and the home link is worked out by the script below.
  -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Open Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #fdf6f9;
      color: #2e2226;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 { color: #8a3d54; font-size: clamp(2rem, 7vw, 3rem); margin: 16px 0 8px; }
    p { font-size: 1.1rem; margin: 0 0 24px; }
    a {
      display: inline-block;
      padding: 12px 26px;
      background: #a8506a;
      color: #fff;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #8a3d54; }
    a:focus-visible { outline: 3px solid #a8506a; outline-offset: 3px; }
    svg { width: min(220px, 60vw); height: auto; }
    @media (prefers-color-scheme: dark) {
      body { background: #1d1417; color: #f5e9ed; }
      h1 { color: #f1b6c3; }
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" role="img" aria-label="A confused pink beluga">
      <circle cx="32" cy="32" r="31" fill="#f9d6dc"/>
      <path d="M10 38c0-12 9-22 22-22 9 0 15 4 18 10 2-4 5-6 8-6-1 4-2 7-4 9 1 1 1 3 1 4 0 10-10 15-23 15-12 0-22-3-22-10z" fill="#e79ca9"/>
      <circle cx="22" cy="33" r="2.6" fill="#4a2330"/>
      <path d="M16 42c3-2 7-2 10 0" stroke="#4a2330" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>Oops, this page swam away</h1>
    <p>We could not find the page you were looking for.</p>
    <a id="home-link" href="/">Back to Pink Beluga</a>
  </main>
  <script>
    // On a GitHub Pages project site the home page lives under /<repo-name>/.
    if (/\.github\.io$/.test(location.hostname)) {
      var first = location.pathname.split('/')[1];
      if (first) document.getElementById('home-link').href = '/' + first + '/';
    }
  </script>
</body>
</html>
